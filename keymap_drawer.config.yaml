        --color--material--teal--400: rgb(38, 166, 154);
        --color--material--teal--500: rgb(0, 150, 136);
        --color--material--teal--600: rgb(0, 137, 123);
        --color--material--teal--700: rgb(0, 121, 107);
        --color--material--teal--800: rgb(0, 105, 92);
        --color--material--teal--900: rgb(0, 77, 64);
        --color--material--teal--a100: rgb(167, 255, 235);
        --color--material--teal--a200: rgb(100, 255, 218);
        --color--material--teal--a400: rgb(29, 233, 182);
        --color--material--teal--a700: rgb(0, 191, 165);

        --color--material--yellow--50: rgb(255, 253, 231);
        --color--material--yellow--100: rgb(255, 249, 196);
        --color--material--yellow--200: rgb(255, 245, 157);
        --color--material--yellow--300: rgb(255, 241, 118);
        --color--material--yellow--400: rgb(255, 238, 88);
        --color--material--yellow--500: rgb(255, 235, 59);
        --color--material--yellow--600: rgb(253, 216, 53);
        --color--material--yellow--700: rgb(251, 192, 45);
        --color--material--yellow--800: rgb(249, 168, 37);
        --color--material--yellow--900: rgb(245, 127, 23);
        --color--material--yellow--a100: rgb(255, 255, 141);
        --color--material--yellow--a200: rgb(255, 255, 0);
        --color--material--yellow--a400: rgb(255, 234, 0);
        --color--material--yellow--a700: rgb(255, 214, 0);

        --color--turquoise--500: rgb(51, 204, 204);

        --color--layer--text: white;

        --color--key--bg: #f6f8fa;
        --color--key--border: #c9cccf;
        --color--key--text--tap: var(--color--text);
        --color--key--text--shifted: var(--color--material--blue-gray--500);
        --color--key--text--hold: var(--color--material--blue-gray--500);

        --color--combo--bg: #cdf;
    }

    /* default key styling */
    rect {
        fill: var(--color--key--bg);
        stroke: var(--color--key--border);
        stroke-width: 1;
    }

    /* color accent for combo boxes */
    rect.combo {
        fill: var(--color--combo--bg);
    }

    /* color accent for held keys */
    rect.held, rect.combo.held {
        fill: #fdd;
    }

    /* color accent for layer-activated keys */
    rect.layer {
        fill: #f99;
    }

    /* color accent for ghost (optional) keys */
    rect.ghost, rect.combo.ghost {
        fill: #ddd;
    }

    rect.mouse_click {
        fill: #white;
        font-weight: bold;
    }

    text {
        text-anchor: middle;
        dominant-baseline: middle;
    }

    /* styling for layer labels */
    text.label {
        font-weight: bold;
        text-anchor: start;
        stroke: var(--color--layer--text);
        stroke-width: 2;
        paint-order: stroke;
    }

    /* styling for combo tap, and key hold/shifted label text */
    text.combo, text.hold, text.shifted {
        font-size: 11px;
    }

    text.hold {
        text-anchor: middle;
        dominant-baseline: middle;
        transform: translate(0pt, -10pt);
    }
    
    /* styling for hold position text in combo box */
    text.combo.hold {
        text-anchor: middle;
        dominant-baseline: middle;
        transform: translate(0pt, 0pt);
    }

    text.shifted {
        text-anchor: middle;
        dominant-baseline: hanging;
    }

    /* styling for hold/shifted label text in combo box */
    text.combo.hold, text.combo.shifted {
        font-size: 8px;
    }

    /* styling for combo dendrons */
    path.combo {
        stroke-width: 1;
        stroke: gray;
        fill: none;
    }

    /* thumb keys */
    .keypos-42, .keypos-43, .keypos-46  {
        --color--key--bg: var(--color--material--blue-gray--100);
        --color--key--border: var(--color--material--blue-gray--50);
        stroke-width: 2;
    }
    .keypos-47 {
        --color--key--bg: var(--color--material--blue--100);
        --color--key--border: var(--color--material--blue--50);
    }

    /* Overrides */
    .boot_loader {
        --color--key--bg: var(--color--material--yellow--400);
        --color--layer--text: var(--color--material--blue--900);
        font-weight: bold;
        stroke-width: 2;
    }
    .bt_key {
        --color--key--bg: var(--color--material--yellow--100);
        --color--layer--text: var(--color--material--blue--900);
        font-weight: bold;
    }
    .glyph {
        path.fill: black;
    }

  shrink_wide_legends: 6
  glyph_tap_size: 15
  glyph_hold_size: 13
  glyph_shifted_size: 13
  glyphs: {}
  glyph_urls:
    tabler: https://unpkg.com/@tabler/icons/icons/outline/{}.svg
    tablerf: https://unpkg.com/@tabler/icons/icons/filled/{}.svg
    mdi: https://raw.githubusercontent.com/Templarian/MaterialDesign-SVG/master/svg/{}.svg
    mdil: https://raw.githubusercontent.com/Pictogrammers/MaterialDesignLight/master/svg/{}.svg
    material: https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/{}/default/48px.svg
  use_local_cache: true

parse_config:
  zmk_additional_includes: ["../../zmk-config/zmk-helpers/include"]
  assign_combos_to_layers: false
  mark_alternate_layer_activators: true
  sticky_label: $$mdi:gesture-tap-hold$$
  trans_legend:
    tap: $$mdi:transfer$$
    type: trans

  raw_binding_map:
    '&mm_grescm': {t: '⎋', s: '` ~'}
    '&mm_bspc_del': {t: '⌫', s: '⌦'}
    '&mm_grescm_gui': {t: ⎋, h: ⌘, s: '~ `'}
    '&mm_spc_unds_layer': {t: '⎵', h: 'SYM', s: '_ -'}
    '&mm_plus_minus': {t: '+', s: '-'}
    '&mm_grave_caret': {t: '`', s: '^'}
    '&mm_bracket_r': {t: '(', s: ')'}
    '&mm_comma_semi_meh': {t: ',', s: ';', h: 'MEH'}
    '&mm_dot_colon': {t: '.', s: ':'}
    '&mm_none_undo': ''
    '&mm_left_word_cut': '↞'
    '&mm_up_save': '↑'
    '&mm_down_copy': '↓'
    '&mm_none_paste': ''
    '&mm_1_cut': '1'
    '&mm_2_copy': '2'
    '&mm_5_save': '5'
    '&swapper_cmd_tab': {t: '⌘↹'}
    '&td_at_email': {t: '@'}
    '&num_word': 'NUM'
    '&nav_word': 'NAV'
    '&caps_word_capslock': "Caps\nWord"
    '&caps_word': '⇪'
    '&td_shift_l': '⇧'
    '&td_shift_r': '⇧'
    '&td_nav_layer': {t: '⏎', h: 'NAV'}
    '&td_bt_clear': 'BT CLR'
    '&m_type_md_code_block': '```'
    '&kt LSHFT': "⇧\nLock"
    '&lt_num_word 4 0': {t: "Num\nWord", h: 'Num'}
    '&ltog LGUI 5': {t: "Cancel\nNav", h: '⌘'}
    '&ltog LGUI 6': {t: "Cancel\nNum", h: '⌘'}
    '&ltog LGUI 7': {t: "Cancel\nSym", h: '⌘'}
    '&ltog LGUI 8': {t: "Cancel\nFunc", h: '⌘'}
    '&ltog LGUI 9': {t: "Cancel\nAdjust", h: '⌘'}
    '&swapper': "⎇↹"
    '&smart_nav': "💡✥"
    '&win_sleep': "WinSleep"
    '&comma_morph': ",<;"
    '&dot_morph': ".>"
    '&tog NAV': "🔒✥"
    '&tog NUM': "🔒🔢"
    '&kp LS(TAB)': '⇧↹'
    '&smart_mouse': "💡🖱"
    '&mo MOUSE': '🖱'
    '&kp K_CANCEL': '␘'
    '&mt LC(BSPC) BSPC': "⌫\n⌃⌫"
    '&mt LC(HOME) UP': "↑\n⌃⇤"
    '&mt LC(END) DOWN': "↓\n⌃⇥"
    '&mt LC(DEL) DEL': "␡\n⌃␡"
    SMART_NUM: {t: "💡🔢", type: layer_keys}

    # Layers
    "&ltq 1 BACKSPACE":
      tap:  $$mdi:backspace$$
      hold: '$$mdi:navigation-variant$$'
    "&ltq 3 TAB":
      tap: $$mdi:keyboard-tab$$
      hold: $$mdi:numeric$$
    "&ltq 2 SPACE":
      tap: $$mdi:keyboard-space$$
      hold: $$mdi:symbol$$
    "&ltq 3 ENTER":
      tap: $$mdi:keyboard-return$$
      hold: $$mdi:numeric$$
    "&ltq 1 DELETE":
      tap: $$mdi:backspace-reverse-outline$$
      hold: $$mdi:navigation-variant$$
    # Home rows
    "&hm LEFT_GUI A":
      tap: 'A'
      shifted: $$mdi:apple-keyboard-command$$
    "&hm LEFT_ALT S":
      tap: 'S'
      shifted: $$mdi:apple-keyboard-option$$
    "&hm LEFT_CONTROL D":
      tap: 'D'
      shifted: $$mdi:apple-keyboard-control$$
    "&hm LEFT_SHIFT F":
      tap: 'F'
      shifted: $$mdi:apple-keyboard-shift$$
    "&hm RIGHT_SHIFT J":
      tap: 'J'
      shifted: $$mdi:apple-keyboard-shift$$
    "&hm RIGHT_CONTROL K":
      tap: 'K'
      shifted: $$mdi:apple-keyboard-control$$
    "&hm RIGHT_ALT L":
      tap: 'L'
      shifted: $$mdi:apple-keyboard-option$$
    # self behaviors
    "&hm LG(LS(V)) P":
      tap: 'P'
      shifted: $$mdi:content-copy$$
    # Mouse
    "&msc SCRL_UP":
      tap: $$mdi:pan-up$$
      hold: ''
      shifted: ''
    "&msc SCRL_DOWN":
      tap: $$mdi:pan-down$$
      hold: ''
      shifted: ''
    "&msc SCRL_LEFT":
      tap: $$mdi:pan-left$$
      hold: ''
      shifted: ''
    "&msc SCRL_RIGHT":
      tap: $$mdi:pan-right$$
      hold: ''
      shifted: ''
    "&mmv MOVE_LEFT":
      tap: $$mdi:menu-left$$
      hold: ''
      shifted: $$mdi:mouse$$
    "&mmv MOVE_RIGHT":
      tap: $$mdi:menu-right$$
      hold: ''
      shifted: $$mdi:mouse$$
    "&mmv MOVE_UP":
      tap: $$mdi:menu-up$$
      hold: ''
      shifted: $$mdi:mouse$$
    "&mmv MOVE_DOWN":
      tap: $$mdi:menu-down$$
      hold: ''
      shifted: $$mdi:mouse$$
    "&mkp LCLK":
      tap: $$mdi:mouse-left-click-outline$$
    "&mkp RCLK":
      tap: $$mdi:mouse-right-click-outline$$
    "&mkp MCLK":
      tap: $$mdi:mouse-scroll-wheel$$
    # Modifiers
    "&caps_word": $$mdi:alpha-w-box$$
    "&kt RSHIFT":
      tap: $$mdi:apple-keyboard-shift$$
      hold: $$mdi:toggle-switch$$

    # Empty
    "&none":
      tap: $$mdi:minus-circle-outline$$
      type: none

    # Whitespace
    "&bkspc_del":
      type: backspace
      tap: $$mdi:backspace$$
      shifted: $$mdi:backspace-reverse-outline$$

    # Bluetooth
    "&bt BT_SEL 0":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 1
    "&bt BT_SEL 1":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 2
    "&bt BT_SEL 2":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 3
    "&bt BT_SEL 3":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 4
    "&bt BT_SEL 4":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 5
    "&out OUT_TOG":
      shifted: $$mdi:usb$$
      tap: $$mdi:toggle-switch$$
      hold: $$mdi:bluetooth$$
    "&bt BT_PRV":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: $$mdi:arrow-up-bold$$
    "&bt BT_NXT":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: $$mdi:arrow-down-bold$$
    # Reset
    "&sys_reset":
      type: bootloader
      tap: $$mdi:backup-restore$$
    "&bootloader":
      tap: $$mdi:progress-download$$

  # ZMK
  zmk_keycode_map:
    # Symbols
    EXCLAMATION: "!"
    EXCL: "!"
    AT_SIGN: "@"
    AT: "@"
    HASH: "#"
    POUND: "#"
    DOLLAR: $
    DLLR: $
    PERCENT: "%"
    PRCNT: "%"
    CARET: ^
    AMPERSAND: "&"
    AMPS: "&"
    ASTERISK: "*"
    ASTRK: "*"
    STAR: "*"
    LEFT_PARENTHESIS: (
    LPAR: (
    RIGHT_PARENTHESIS: )
    RPAR: )
    EQUAL:
      tap: "="
      shifted: "+"
    PLUS: +
    MINUS:
      tap: "-"
      shifted: "_"
    UNDERSCORE: _
    UNDER: _
    SLASH:
      tap: "/"
      shifted: "?"
    FSLH:
      tap: "/"
      shifted: "?"
    QUESTION: "?"
    QMARK: "?"
    BACKSLASH:
      tap: '\'
      shifted: "|"
    BSLH:
      tap: '\'
      shifted: "|"
    PIPE: "|"
    NON_US_BACKSLASH: \
    PIPE2: "|"
    NON_US_BSLH: "|"
    SEMICOLON:
      tap: ";"
      shifted: ":"
    SEMI:
      tap: ";"
      shifted: ":"
    COLON: ":"
    SINGLE_QUOTE:
      tap: "'"
      shifted: '"'
    SQT:
      tap: "'"
      shifted: '"'
    APOSTROPHE: <
    APOS: .
    DOUBLE_QUOTES: '"'
    DQT: '"'

    LESS_THAN: <
    LT: <
    PERIOD: '.'
    DOT:
      tap: "."
      shifted: ">"
    COMMA:
      tap: ","
      shifted: "<"
    GREATER_THAN: ">"
    GT: ">"
    LEFT_BRACKET:
      tap: "["
      shifted: "{"
    LBKT:
      tap: "["
      shifted: "{"
    LEFT_BRACE: "{"
    LBRC: "{"
    RIGHT_BRACKET:
      tap: "]"
      shifted: "}"
    RBKT:
      tap: "]"
      shifted: "}"
    RIGHT_BRACE: "}"
    RBRC: "}"
    GRAVE:
      tap: "`"
      shifted: "~"
    TILDE: "~"
    NON_US_HASH: "#"
    NUHS: "#"
    TILDE2: "~"

    LGUI: ⌘
    TAB: ↹
    RETURN: '⏎'
    RET: '⏎'
    ESCAPE: '⎋'
    ESC: '⎋'
    BSPC: '⌫'
    BKSP: '⌫'
    DEL: '␡'
    INS: '⎀'
    HOME: '⇤'
    END: '⇥'
    PG_UP: '⇞'
    PG_DN: '⇟'

    # Numbers
    N1:
      tap: 1
      shifted: "!"
    N2:
      tap: 2
      shifted: "@"
    N3:
      tap: 3
      shifted: "#"
    N4:
      tap: 4
      shifted: "$"
    N5:
      tap: 5
      shifted: "%"
    N6:
      tap: 6
      shifted: "^"
    N7:
      tap: 7
      shifted: "&"
    N8:
      tap: 8
      shifted: "*"
    N9:
      tap: 9
      shifted: "("
